<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.canvas{
    position: relative;
    height: 400px;
    width: 400px;
    background-color: rgba(200, 211, 166, 0.792);
}

.part1{
    position:absolute;
    height:200px;
    width: 100px;
    background-color: rgb(80, 45, 2);
    
    left:50px;
    top:50px;
    clip-path: polygon(0 0, 100% 20%, 100% 100%, 0 80%);
    border-radius: 5px;transform: rotatey('180');
    
}
.part2{
    position:absolute;
    height:200px;
    width: 100px;
    left:100px;
    background-color: rgb(80, 45, 2);
    
    left:188px;
    top:80px;
    clip-path: polygon(0 0, 100% 20%, 100% 100%, 0 80%);
    border-radius: 5px;

}
.part3{
    position:absolute;
    height:160px;
    width: 30px;
    left:150px;
    top:90px;
    background-color: black;
    
} 

    </style>
</head>
<body>
    <div class="canvas">
<div class="part1"></div>
<div class="part2"></div>
<div class="part3"></div>
    </div>
</body>
</html>
