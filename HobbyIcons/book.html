<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
.canvas{
    position: relative;
    height: 400px;
    width: 400px;
    background-color: #ABD2FA;
}

.page{
    background-color: antiquewhite;
    position:absolute;
    height:200px;
    width: 100px;
    border-radius: 5px;
    clip-path: polygon(0 0, 100% 20%, 100% 100%, 0 80%);
}


.part2{
    left:104px;
    top:116px;
    transform: rotate('deg');
    transform:scaleX(-0.5);

}
.part3{
    left:163px;
    top:115px;
    transform:scaleX(0.5);
}
.part4{
    left:185px;
    top:115px;
    transform: rotate('45deg');
    transform:scaleX(0.7);

}
.part5{
    left:80px;
    top:110px;
    transform: rotate('49deg');
    transform:scaleX(-1);
}


.part6{
    left:85px;
    top:113px;
    transform: rotate('47deg');
    transform:scaleX(-0.7);
}

.part7{
    left:185px;
    top:110px;
    transform: rotate('49deg');
    transform:scaleX(1);
    background-color: burlywood;
}
.part8{
    left:80px;
    top:109px;
    transform: rotate('49deg');
    transform:scaleX(-1);
     background-color: burlywood;
}

.part1{
    position:absolute;
    height:170px;
    width: 10px;
    left:178px;
    top:108px;
    background-color: black;
    border-radius: 5px;
} 

.part9{
    background-color: black;
    height: 2px;
    position: absolute;
    width:60px;
    left:210px;
    top: 150px;
   transform: rotate(20deg);
   
} 
.part10{
     background-color: black;
    height: 2px;
    position: absolute;
    width:60px;
    left:210px;
    top: 170px;
   transform: rotate(20deg);
   
}

    </style>
</head>
<body>
    <div class="canvas">
<div class="part1 spine book-cover"></div>
<div class="part2 page"></div>
<div class="part3 page"></div>
<div class="part4 page"></div>
<div class="part5 page"></div>
<div class="part6 page"></div>
<div class="part7 page"></div>
<div class="part8 page"></div>
<div class="part9 text"></div>

    </div>
